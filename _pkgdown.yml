url: https://critiplot.github.io/critiplotR/

template:
  bootstrap: 5
  bootswatch: flatly
  params:
    bootswatch: flatly
  includes:
    in_header: |
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "critiplotR",
        "alternateName": "critiplot R package",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Cross-platform",
        "softwareVersion": "0.2.0",
        "programmingLanguage": "R",
        "description": "Open-source R package for visualizing risk-of-bias and certainty of evidence assessments in systematic reviews and meta-analyses. The official R interface to the Python package critiplot, producing publication-ready traffic-light plots and stacked bar charts for NOS, JBI checklists, GRADE, ROBIS, and MMAT.",
        "url": "https://critiplot.github.io/critiplotR/",
        "keywords": "risk of bias, certainty of evidence, systematic reviews, meta-analysis, Newcastle-Ottawa Scale, NOS, JBI, GRADE, ROBIS, MMAT, traffic-light plot, R package, CRAN",
        "author": {
          "@type": "Person",
          "name": "Vihaan Sahu",
          "url": "https://github.com/aurumz-rgb"
        },
        "license": "https://opensource.org/licenses/Apache-2.0",
        "sameAs": [
          "https://github.com/critiplot/critiplotR",
          "https://cran.r-project.org/package=critiplotR",
          "https://doi.org/10.5281/zenodo.24208481"
        ]
      }
      </script>

footer:
  structure:
    left: developed_by
    right: built_with
  components:
    developed_by: >
      critiplotR is developed by
      <a href="https://github.com/aurumz-rgb">Vihaan Sahu</a>.
      Plots are produced by the Python package
      <a href="https://critiplot.github.io">critiplot</a>.

home:
  title: "critiplotR: R package for risk-of-bias and certainty of evidence plots"
  description: "critiplotR is an open-source R package (the official R interface to critiplot) for publication-ready traffic-light plots and stacked bar charts of risk-of-bias and certainty-of-evidence assessments: NOS, JBI checklists, GRADE, ROBIS, and MMAT."
  links:
  - text: Critiplot website
    href: https://critiplot.github.io
  - text: Python critiplot package
    href: https://pypi.org/project/critiplot/
  - text: Main Critiplot repository
    href: https://github.com/aurumz-rgb/Critiplot-main

reference:
- title: Plot functions
  desc: >
    Each function reads a data frame or a `.csv`/`.xls`/`.xlsx` file and
    writes a publication-ready traffic-light plot or stacked bar chart
    for one risk-of-bias or certainty-of-evidence framework. All functions
    share the same interface and return the path(s) of the file(s) they
    created, invisibly.
- subtitle: Observational studies
  contents:
  - plot_nos
- subtitle: Case reports and case series
  contents:
  - plot_jbi_case_report
  - plot_jbi_case_series
- subtitle: Other frameworks
  contents:
  - plot_grade
  - plot_robis
  - plot_mmat
- title: About
  contents:
  - critiplotR-package
